  <meta property="og:title" content="ICST Issue Portal - Campus Issue Reporting" />

  <link rel="preload" href="/logo.png" as="image" fetchpriority="high">

<body>
  <div id="root">
    <!-- 🚀 SEO "Server-Side" Prerender for instant load -->
    <section

      <div style="max-width: 800px; margin: 0 auto; padding: 0 16px;">
        <span
          style="display: inline-block; padding: 6px 20px; border-radius: 999px; background: rgba(255,255,255,0.8); border: 1px solid #e2e8f0; margin-bottom: 24px; color: #8b5cf6; font-weight: 500; font-size: 15px;">
          উন্নত প্রতিষ্ঠান গড়তে আপনার কণ্ঠস্বরই আসল শক্তি
        </span>
        <h1 style="font-size: 3.5rem; font-weight: 700; color: #1e293b; margin-bottom: 24px; line-height: 1.1;">
          ক্যাম্পাসের সমস্যা? জানান আমাদের!
        </h1>
        <p style="font-size: 1.125rem; color: #475569; margin-bottom: 32px; line-height: 1.6;">
          প্রতিষ্ঠানকে আরও ভালো করতে চান? তবে শুধু মনে মনে ক্ষুব্ধ না থেকে সমস্যা রিপোর্ট করুন! আপনি ও আমি মিলেই
          'উন্নয়নের নায়ক' হয়ে উঠতে পারি।
        </p>
        <div
          style="display: inline-block; padding: 16px 32px; background: #8b5cf6; color: white; border-radius: 12px; font-weight: 600; font-size: 1.125rem;">
          সমস্যা জানান
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="/src/main.tsx"></script>
